<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión </title>
  <script src="/js/ajustes.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/medistock.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
  <main id="contenido" tabindex="-1" class="login">
  <div class="login-box">
    <h1 class="logo">MediStock</h1>
   <form id="form">
  <label for="cedula" class="form-label">Cédula profesional</label>
  <input id="cedula" class="form-control mb-3" placeholder="Ej. 12345678" inputmode="numeric" pattern="[0-9]{7,8}" maxlength="8" required>

  <label for="nombre" class="form-label">Nombre(s)</label>
<input id="nombre" class="form-control mb-3" placeholder="Ej. Ana" required>

<label for="ap_paterno" class="form-label">Apellido paterno</label>
<input id="ap_paterno" class="form-control mb-3" placeholder="Ej. López" required>

<label for="ap_materno" class="form-label">Apellido materno</label>
<input id="ap_materno" class="form-control mb-3" placeholder="Ej. Pérez">

  <label for="especialidad" class="form-label">Especialidad</label>
  <input id="especialidad" class="form-control mb-3" placeholder="Ej. Medicina general" required>

  <label for="correo" class="form-label">Correo electrónico</label>
  <input id="correo" type="email" class="form-control mb-3" placeholder="correo@ejemplo.com" required>

  <label for="usuario" class="form-label">Nombre de usuario</label>
  <input id="usuario" class="form-control mb-3" placeholder="Elige un usuario" autocomplete="username" required>

  <label for="password" class="form-label">Contraseña</label>
  <input id="password" type="password" class="form-control mb-3" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>

  <label for="password2" class="form-label">Confirmar contraseña</label>
  <input id="password2" type="password" class="form-control mb-3" placeholder="Repite la contraseña" autocomplete="new-password" required>

  <div id="error" class="aviso error d-none" role="alert"></div>
  <button class="btn btn-rose w-100 mt-2">Registrarme</button>
</form>
    <p class="text-center mt-3 mb-0">
      ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
    </p>
  </div>
  <details class="panel-acc" id="panelAjustes">
      <summary>Opciones de accesibilidad</summary>
      <div id="panelCuerpo"></div>
    </details>
  </main>
<script src="/js/panel-ajustes.js"></script>
<script src="/js/registro.js"></script>
</body>
</html>
