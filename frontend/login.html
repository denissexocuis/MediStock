<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | MediStock</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:420px">
    <h1 class="h3 mb-4">Iniciar sesión</h1>
    <form id="form">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input id="usuario" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <button class="btn btn-success w-100">Entrar</button>
    </form>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
