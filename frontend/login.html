<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión </title>
  <script src="/js/ajustes.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/medistock.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
  <main id="contenido" tabindex="-1" class="login">
    <div class="login-box">
      <h1 class="logo">MediStock</h1>
      <form id="form">
        <label for="usuario" class="form-label">Nombre de usuario</label>
        <input id="usuario" class="form-control mb-3" placeholder="Ingresa usuario" autocomplete="username" required>
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group mb-3">
          <input id="password" type="password" class="form-control" placeholder="Ingresa contraseña" autocomplete="current-password" required>
          <button type="button" id="ver" class="btn btn-claro" aria-pressed="false">Mostrar</button>
        </div>
        <div id="error" class="aviso error d-none" role="alert"></div>
        <button class="btn btn-rose w-100 mt-2">Ingresar</button>

          <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta? <a href="/registro">Regístrate</a>
          </p>
      </form>
    </div>
    <details class="panel-acc" id="panelAjustes">
      <summary>Opciones de accesibilidad</summary>
      <div id="panelCuerpo"></div>
    </details>
  </main>
  <script src="/js/panel-ajustes.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
