<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión </title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/medistock.css">
</head>
<body>
  <main class="login">
    <div class="login-box">
      <h1 class="logo">MediStock</h1>
      <form id="form">
        <label for="usuario" class="form-label">Nombre de usuario</label>
        <input id="usuario" class="form-control mb-3" placeholder="Ingresa usuario" autocomplete="username" required>
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group mb-3">
          <input id="password" type="password" class="form-control" placeholder="Ingresa contraseña" autocomplete="current-password" required>
          <button type="button" id="ver" class="btn btn-claro" aria-pressed="false">Mostrar</button>
        </div>
        <div id="error" class="aviso error d-none" role="alert"></div>
        <button class="btn btn-rose w-100 mt-2">Ingresar</button>
      </form>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
